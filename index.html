<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BsBus Sem Escalas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --cor-bsbus: #4dff00;
  --alerta: #e11d48;
  --laranja: #ea580c;
  --ok: #16a34a;
  --surface-solid: #ffffff;
  --text-main: #1e293b;
  --text-sec: #64748b;
  --border: rgba(0, 0, 0, 0.12);
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body, html { height: 100%; width: 100%; overflow: hidden; background: #e5e5e5; }
#map { height: 100%; width: 100%; z-index: 0; }
.leaflet-control-attribution { display: none !important; }

/* === TOP BAR (busca + botão de menu) === */
.top-bar {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: calc(100% - 20px); max-width: 440px; z-index: 1000;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.top-bar > * { pointer-events: auto; }
.top-row { display: flex; gap: 8px; align-items: center; }
.search-container {
  flex: 1; min-width: 0; background: white; height: 48px; display: flex; align-items: center;
  padding: 0 15px; border-radius: 24px; position: relative; box-shadow: var(--shadow);
}
#search { flex: 1; min-width: 0; border: none; background: transparent; font-size: 16px; outline: none; height: 100%; color: var(--text-main); font-weight: 500; margin-left: 10px; padding-right: 30px; }
.search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: rgba(128,128,128,0.2); border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; color: var(--text-sec); font-size: 12px; font-weight: 800; }
.search-clear.visible { display: flex; }
.btn-round {
  flex: none; width: 48px; height: 48px; border-radius: 50%; border: none; background: white;
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-main);
}
.btn-round:active { transform: scale(0.95); }
.search-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tag { background: var(--text-main); color: var(--surface-solid); font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: background 0.2s; }
.tag:hover { background-color: #ff4d4d; color: white; }
.suggestions { background: var(--surface-solid); border-radius: 12px; max-height: 45vh; overflow-y: auto; display: none; box-shadow: var(--shadow); color: var(--text-main); width: 100%; }
.suggestion-item { padding: 12px 15px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; transition: background 0.1s; }
.suggestion-item.highlighted { background: rgba(37, 99, 235, 0.15); color: var(--primary); font-weight: 700; }

/* === CONTROLE DE CAMADAS (canto inferior direito, discreto) === */
.leaflet-bottom.leaflet-right { margin-right: 6px; margin-bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 1001; }
.leaflet-control-layers {
  border-radius: 12px !important; box-shadow: var(--shadow) !important;
  background: rgba(255,255,255,0.97) !important; border: 1px solid rgba(0,0,0,0.1) !important;
}

/* === MENU LATERAL (drawer) === */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1900;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 88vw); background: #fff; z-index: 2000;
  transform: translateX(105%); transition: transform .25s ease; box-shadow: -6px 0 24px rgba(0,0,0,0.2);
  padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.brand { font-weight: 800; font-size: 17px; color: var(--text-main); }
.brand span { background: var(--cor-bsbus); padding: 1px 6px; border-radius: 6px; color: #000; }
.icon-btn { border: none; background: #f1f5f9; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px; font-weight: 800; color: var(--text-sec); }
.panel-title { font-size: 11px; font-weight: 800; color: var(--text-sec); text-transform: uppercase; margin: 6px 0 10px; letter-spacing: .03em; }
.filter-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 10px; cursor: pointer; color: var(--text-main); }
.filter-item input { width: 18px; height: 18px; accent-color: var(--cor-bsbus); }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); }
.divider { height: 1px; background: #eee; margin: 12px 0; }
.hint { font-size: 11px; color: var(--text-sec); line-height: 1.4; margin: -4px 0 10px; }

/* Switch */
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { display: none; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: #4dff00; }
input:checked + .slider:before { transform: translateX(18px); }

/* === BOTÃO + PAINEL DE CONFLITOS === */
.alert-fab {
  position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1002;
  border: none; border-radius: 24px; padding: 11px 15px; font-weight: 800; font-size: 13px;
  display: flex; align-items: center; gap: 8px; background: #fff; color: #166534;
  box-shadow: var(--shadow); cursor: pointer; max-width: calc(100vw - 80px);
}
.alert-fab .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex: none; }
.alert-fab.tem-alerta { background: var(--alerta); color: #fff; }
.alert-fab.tem-alerta .dot { background: #fff; animation: pulso-branco 1.4s infinite; }
@keyframes pulso-branco { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }

.alert-panel {
  position: fixed; left: 10px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 1500;
  width: min(370px, calc(100vw - 20px)); max-height: min(62vh, 540px);
  display: none; flex-direction: column; background: #fff; border-radius: 16px;
  box-shadow: var(--shadow); overflow: hidden;
}
.alert-panel.open { display: flex; }
.ap-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; }
.ap-title { font-weight: 800; font-size: 15px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pisca 1.6s infinite; }
@keyframes pisca { 50% { opacity: .25; } }
.ap-sub { padding: 0 14px 8px; font-size: 11px; color: var(--text-sec); font-weight: 600; }
.ap-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 14px 8px; }
.chip { border-radius: 10px; padding: 7px 4px; text-align: center; background: #f1f5f9; }
.chip b { display: block; font-size: 18px; font-weight: 800; line-height: 1.1; }
.chip small { font-size: 10px; font-weight: 700; color: var(--text-sec); }
.chip.ok b { color: var(--ok); }
.chip.fora b { color: var(--alerta); }
.chip.sent b { color: var(--laranja); }
.ap-foot { padding: 0 14px 8px; font-size: 11px; color: var(--text-sec); }
.ap-list { overflow-y: auto; border-top: 1px solid var(--border); flex: 1; min-height: 0; }
.conf-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
.conf-item:active { background: #f8fafc; }
.conf-badge { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--alerta); color: #fff; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.conf-badge.sent { background: var(--laranja); }
.conf-main { flex: 1; min-width: 0; font-size: 13px; color: var(--text-main); }
.conf-main b { font-weight: 800; }
.conf-main small { display: block; font-size: 11px; color: var(--text-sec); font-weight: 600; margin-top: 1px; }
.conf-go { color: var(--text-sec); font-size: 18px; font-weight: 700; }
.ap-empty { padding: 18px 14px; text-align: center; font-size: 13px; color: var(--ok); font-weight: 700; }

@media (max-width: 600px) {
  .alert-panel { left: 0; right: 0; bottom: 0; width: 100%; max-height: 66vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .alert-fab { padding: 10px 13px; font-size: 12px; }
}

/* === MARCADORES === */
.bus-marker-custom {
  background: var(--cor-bsbus); border: 2px solid #000; color: #000;
  font-weight: 900; font-size: 11px; padding: 2px 6px; border-radius: 6px;
  white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  position: absolute; transform: translate(-50%, -50%); display: block;
}

/* === VEÍCULO PERDIDO / SENTIDO ERRADO === */
.bus-marker-custom.fora-rota {
  border: 3px solid var(--alerta);
  animation: pulso-vermelho 1.6s infinite;
}
.bus-marker-custom.fora-rota::after {
  content: '!';
  position: absolute; top: -12px; right: -12px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--alerta); color: #fff; border: 2px solid #fff;
  font-size: 12px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
}
@keyframes pulso-vermelho {
  0% { box-shadow: 0 0 0 0 rgba(225,29,72,.7); }
  70% { box-shadow: 0 0 0 10px rgba(225,29,72,0); }
  100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); }
}
.p-alerta {
  background: rgba(225, 29, 72, 0.1); color: var(--alerta);
  border-radius: 8px; padding: 5px 8px; margin-bottom: 6px;
  font-size: 12px; font-weight: 700; text-align: center;
}

/* === POPUP === */
.leaflet-popup-content-wrapper { background: white; border-radius: 14px; padding: 0; box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 0 !important; width: 230px !important; max-width: 75vw; text-align: center; }
.p-header {
  padding: 6px 10px; font-weight: 800; text-align: center;
  background: #f1f5f9; border-top-left-radius: 14px; border-top-right-radius: 14px;
  border-bottom: 3px solid var(--cor-bsbus); font-size: 14px;
}
.p-body { padding: 10px 15px; font-size: 12px; }
.p-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
.p-label { color: var(--text-sec); font-weight: 500; }
.p-val { font-weight: 700; color: #000; text-align: right; }

/* ÍCONES DAS PARADAS NO MAPA */
.icon-map { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.placa-azul-map { display: flex; background-color: #385EA9; width: 32px; height: 37px; justify-content: center; align-items: center; border-radius: 4px; pointer-events: auto; }
.borda-map { display: flex; align-items: center; justify-content: center; border: 1px solid #ffffff; border-radius: 2px; height: 90%; width: 90%; }
.info-placa-map { display: flex; align-items: center; justify-content: center; background-color: #ffffff; width: 21px; height: 19px; margin-bottom: 5px; font-size: 11px; font-weight: bold; border-radius: 1px; color: #000; text-align: center; }
.poste-map { width: 4px; height: 10px; background-color: #000; }

/* Popup da parada (responsivo) */
.popup-parada .leaflet-popup-content {
  width: auto !important; min-width: 180px; max-width: min(350px, 75vw);
  padding: 12px 24px !important; text-align: center;
  color: black !important; font-weight: normal !important;
}
.popup-parada .leaflet-popup-content-wrapper { padding: 0; border-radius: 10px; }
</style>
</head>
<body>

<div id="map"></div>

<!-- BUSCA + MENU -->
<div class="top-bar">
  <div class="top-row">
    <div class="search-container">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text-sec); flex:none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" placeholder="Linha ou prefixo..." autocomplete="off" inputmode="numeric">
      <div class="search-clear" id="btn-search-clear" onclick="limparBuscaInput()">✕</div>
    </div>
    <button class="btn-round" id="btn-menu" aria-label="Abrir menu" onclick="abrirMenu()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </button>
  </div>
  <div id="search-tags" class="search-tags"></div>
  <div id="suggestions" class="suggestions"></div>
</div>

<!-- MENU LATERAL -->
<div class="backdrop" id="backdrop" onclick="fecharMenu()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="brand">🚌 BsBus <span>Sem Escalas</span></div>
    <button class="icon-btn" onclick="fecharMenu()" aria-label="Fechar">✕</button>
  </div>

  <div class="panel-title">Exibição</div>
  <div class="opt-row">
    <span>Mostrar paradas</span>
    <label class="switch"><input type="checkbox" id="chk-show-stops"><span class="slider"></span></label>
  </div>
  <div class="opt-row">
    <span>Só veículos perdidos</span>
    <label class="switch"><input type="checkbox" id="chk-so-perdidos"><span class="slider"></span></label>
  </div>
  <div class="hint">Mostra no mapa apenas os veículos fora do raio da rota ou com sentido trocado.</div>

  <div class="divider"></div>
  <div class="panel-title">Setores Operacionais</div>
  <div id="sector-filters">
    <label class="filter-item"><input type="checkbox" class="chk-sector" value="Brazlandia" checked> Brazlândia</label>
    <label class="filter-item"><input type="checkbox" class="chk-sector" value="Setor O" checked> Setor "O"</label>
    <label class="filter-item"><input type="checkbox" class="chk-sector" value="Recanto" checked> Recanto</label>
    <label class="filter-item"><input type="checkbox" class="chk-sector" value="QNQ" checked> QNQ/QNR</label>
    <label class="filter-item"><input type="checkbox" class="chk-sector" value="Sof Sul" checked> Sof Sul</label>
  </div>

  <div class="divider"></div>
  <div class="panel-title">Tipos</div>
  <label class="filter-item"><input type="checkbox" id="chk-com-linha" checked> Com Linha</label>
  <label class="filter-item"><input type="checkbox" id="chk-sem-linha" checked> Sem Linha</label>
  <label class="filter-item"><input type="checkbox" id="chk-transferencia" checked> Transferência</label>
  <label class="filter-item"><input type="checkbox" id="chk-VNR" checked> VNR</label>
</aside>

<!-- PAINEL DE CONFLITOS EM TEMPO REAL -->
<button class="alert-fab" id="alert-fab" onclick="alternarPainel()">
  <span class="dot"></span><span id="alert-fab-text">Verificando rotas…</span>
</button>

<section class="alert-panel" id="alert-panel">
  <div class="ap-head">
    <div class="ap-title"><span class="live"></span> Monitor de rotas</div>
    <button class="icon-btn" onclick="alternarPainel(false)" aria-label="Fechar">✕</button>
  </div>
  <div class="ap-sub" id="ap-sub">Aguardando dados…</div>
  <div class="ap-stats" id="ap-stats"></div>
  <div class="ap-foot" id="ap-foot"></div>
  <div class="ap-list" id="ap-list"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const API_URL = "https://gps-bsbus.vercel.app/veiculos";
const BSBUS_GREEN = "#4dff00";
const itinerarioCache = new Map();

// --- CONFIG DETECÇÃO FORA DE ROTA ---
const RAIO_FORA_ROTA_M = 150;          // distância máxima aceita da polyline (metros)
const RAIO_SENTIDO_INVERTIDO_M = 60;   // a menos disso do sentido oposto => sentido provavelmente invertido
const LEITURAS_PARA_ALERTA = 2;        // leituras consecutivas fora do raio antes de alertar
const FATIA_MS = 12;                   // tempo máx. de cálculo antes de devolver o controle ao navegador
const DOWNLOADS_SIMULTANEOS = 6;       // itinerários baixados ao mesmo tempo
const RETRY_FALHA_MS = 60000;          // espera antes de tentar baixar de novo um itinerário que falhou

const shapeCache = new Map();          // "linha|directionId" -> [[lat,lng], ...] | null
const falhasItinerario = new Map();    // linha -> timestamp da falha
const statusRota = {};                 // prefixo -> { fora, dist, cont, motivo, estado }
let resumoAtual = null;
let ultimaVerificacao = 0;
let checando = false;
let textoProgresso = '';

// --- PREFERÊNCIAS ---
const chkStops = $('chk-show-stops');
chkStops.checked = localStorage.getItem('showStops') !== 'false';
chkStops.addEventListener('change', (e) => {
  const isChecked = e.target.checked;
  localStorage.setItem('showStops', isChecked);
  if (!isChecked) {
    activeStops.forEach(s => map.removeLayer(s));
    activeStops = [];
  } else if (rotaAtiva && rotaAtiva.itinerarioCompleto) {
    renderStops(rotaAtiva.itinerarioCompleto);
  }
});

const chkSoPerdidos = $('chk-so-perdidos');
chkSoPerdidos.checked = localStorage.getItem('soPerdidos') === 'true';
chkSoPerdidos.addEventListener('change', (e) => localStorage.setItem('soPerdidos', e.target.checked));
const soPerdidos = () => chkSoPerdidos.checked;

const savedLayer = localStorage.getItem('lastMapLayer') || "Padrão";

// Permite zoom ampliado até o nível 22 em todas as camadas
const tiles = {
  "Híbrido": L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], maxZoom: 22, maxNativeZoom: 20 }),
  "Padrão": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 }),
  "Satélite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 19 })
};

const map = L.map('map', { zoomControl: false, closePopupOnClick: false, maxZoom: 22 }).setView([-15.7942, -47.8822], 12);

(tiles[savedLayer] || tiles["Padrão"]).addTo(map);
L.control.layers(tiles, null, { position: 'bottomright' }).addTo(map);
map.on('baselayerchange', (e) => localStorage.setItem('lastMapLayer', e.name));

let markers = {};
let busDataRaw = [];
let activePolylines = [];
let activeStops = [];
let termosBusca = [];
let itemSelecionado = null;
let highlightedIndex = -1;
let rotaAtiva = null;
let travaPopup = null;

// --- MENU / PAINEL ---
function abrirMenu() { alternarPainel(false); $('drawer').classList.add('open'); $('backdrop').classList.add('open'); }
function fecharMenu() { $('drawer').classList.remove('open'); $('backdrop').classList.remove('open'); }
function alternarPainel(forcar) {
  const p = $('alert-panel');
  const abrir = typeof forcar === 'boolean' ? forcar : !p.classList.contains('open');
  p.classList.toggle('open', abrir);
  if (abrir) { fecharMenu(); atualizarPainel(); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { fecharMenu(); alternarPainel(false); }
});

// --- UTILITÁRIOS ---
function decodePolyline(encoded) {
  if (!encoded) return [];
  let poly = [];
  let index = 0, len = encoded.length;
  let lat = 0, lng = 0;

  while (index < len) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    lat += ((result & 1) ? ~(result >> 1) : (result >> 1));

    shift = 0; result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    lng += ((result & 1) ? ~(result >> 1) : (result >> 1));

    poly.push([lat / 1e5, lng / 1e5]);
  }
  return poly;
}

function parseDateBR(dataStr, horaStr) {
  if (!dataStr) return new Date();
  const p = dataStr.split('/');
  return new Date(`${p[2]}-${p[1]}-${p[0]}T${horaStr}`);
}

function getSector(prefixo) {
  let pStr = String(prefixo).trim();
  if (pStr === "VNR") return "VNR";
  let core = 0;
  if (pStr.startsWith('50')) core = parseInt(pStr.substring(2, pStr.length - 1));
  else if (pStr.startsWith('71')) core = parseInt(pStr.substring(1, pStr.length - 1));

  if ((core >= 1 && core <= 33) || (core >= 1072 && core <= 1092) || (core >= 1101 && core <= 1129)) return "Brazlandia";
  if ((core >= 1033 && core <= 1071) || (core >= 1093 && core <= 1100) || (core >= 206 && core <= 346) || (core >= 492 && core <= 506)) return "Setor O";
  if ((core >= 385 && core <= 459) || (core >= 460 && core <= 471)) return "Recanto";
  if ((core >= 34 && core <= 205) || (core >= 472 && core <= 491)) return "QNQ";
  if ((core >= 347 && core <= 384) || (core >= 1130 && core <= 1132)) return "Sof Sul";
  return "Outro";
}

function getLiveStatus(dataStr, horaStr) {
  const last = parseDateBR(dataStr, horaStr);
  const now = new Date();
  let diff = Math.floor((now - last) / 1000);
  if (diff < 0) diff = 0;
  const dd = Math.floor(diff / 86400), hh = Math.floor((diff % 86400) / 3600), mm = Math.floor((diff % 3600) / 60), ss = diff % 60;
  if (dd > 0) return `${dd}d ${hh}h ${mm}m ${ss}s atrás`;
  if (hh > 0) return `${hh}h ${mm}m ${ss}s atrás`;
  if (mm > 0) return `${mm}min ${ss}seg atrás`;
  return `${ss} seg atrás`;
}

// =====================================================================
//  DETECÇÃO FORA DE ROTA (processamento em fatias, sem travar a tela)
// =====================================================================
const yieldUI = () => new Promise(r => setTimeout(r, 0));

function linhaDe(v) {
  const linha = String(v.linha || '').trim();
  if (!linha || linha === "0.001" || String(v.prefixo).trim() === "VNR") return '';
  return linha;
}

async function carregarItinerario(linha) {
  try {
    const r = await fetch(`https://gps-bsbus.vercel.app/itinerario/${linha}`);
    const data = await r.json();
    if (data && data.itinerarios) {
      itinerarioCache.set(linha, data);
      falhasItinerario.delete(linha);
    } else {
      falhasItinerario.set(linha, Date.now());
    }
  } catch (e) {
    falhasItinerario.set(linha, Date.now());
  }
}

async function prefetchItinerarios(linhas, simultaneos) {
  let i = 0;
  const workers = Array.from({ length: Math.min(simultaneos, linhas.length) }, async () => {
    while (i < linhas.length) await carregarItinerario(linhas[i++]);
  });
  await Promise.all(workers);
}

// Shape já decodificado (usa só o que está em cache; sem rede)
function getShapeSync(linha, directionId) {
  const key = `${linha}|${directionId}`;
  if (shapeCache.has(key)) return shapeCache.get(key);
  const data = itinerarioCache.get(linha);
  if (!data) return null;
  const it = data.itinerarios && data.itinerarios.find(i => i.directionId === directionId);
  const coords = it && it.shape ? decodePolyline(it.shape) : null;
  const ok = coords && coords.length > 1 ? coords : null;
  shapeCache.set(key, ok);
  return ok;
}

// Distância (m) do ponto até a polyline. Se `parar` for informado, retorna assim que
// achar um trecho mais perto que isso (suficiente para saber que está dentro do raio).
function distPontoPolylineM(lat, lng, coords, parar) {
  const rad = Math.PI / 180, R = 6371000;
  const kx = Math.cos(lat * rad) * R * rad;
  const ky = R * rad;
  let min = Infinity;
  for (let i = 0; i < coords.length - 1; i++) {
    const ax = (coords[i][1] - lng) * kx,     ay = (coords[i][0] - lat) * ky;
    const bx = (coords[i + 1][1] - lng) * kx, by = (coords[i + 1][0] - lat) * ky;

    // descarta rápido segmentos que estão longe demais
    if ((ax > min && bx > min) || (ax < -min && bx < -min) || (ay > min && by > min) || (ay < -min && by < -min)) continue;

    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < min) {
      min = d;
      if (parar !== undefined && min <= parar) return min;
    }
  }
  return min;
}

function verificarVeiculo(v) {
  let st = statusRota[v.prefixo];
  if (!st) st = statusRota[v.prefixo] = { fora: false, dist: 0, cont: 0, motivo: null, estado: 'pendente' };

  const linha = linhaDe(v);
  if (!linha) {
    st.fora = true;
    st.cont = LEITURAS_PARA_ALERTA;
    st.motivo = 'sem-linha';
    st.estado = 'semrota';
    return;
  }

  if (!Number.isFinite(v.latitude) || !Number.isFinite(v.longitude)) { st.estado = 'sem-gps'; return; }

  const dir = v.sentido === "Ida" ? 0 : 1;
  const coords = getShapeSync(linha, dir);
  if (!coords) { st.fora = false; st.cont = 0; st.motivo = null; st.estado = 'sem-itin'; return; }

  const dist = distPontoPolylineM(v.latitude, v.longitude, coords, RAIO_FORA_ROTA_M);
  st.dist = dist;

  if (dist > RAIO_FORA_ROTA_M) {
    st.cont++;
    st.motivo = 'rota';
    const oposto = getShapeSync(linha, 1 - dir);
    if (oposto) {
      const dOposto = distPontoPolylineM(v.latitude, v.longitude, oposto, RAIO_SENTIDO_INVERTIDO_M);
      if (dOposto <= RAIO_SENTIDO_INVERTIDO_M) st.motivo = 'sentido';
    }
  } else {
    st.cont = 0;
    st.motivo = null;
  }

  st.fora = st.cont >= LEITURAS_PARA_ALERTA;
  st.estado = st.fora ? st.motivo : 'ok';
}

// Liga/desliga a borda vermelha + "!" no marcador e atualiza o popup se estiver aberto
function aplicarAlerta(prefixo) {
  const m = markers[prefixo];
  if (!m) return;
  const fora = !!(statusRota[prefixo] && statusRota[prefixo].fora);
  const el = m.getElement() && m.getElement().querySelector('.bus-marker-custom');
  if (el) el.classList.toggle('fora-rota', fora);
  m.setZIndexOffset(fora ? 4000 : 2000);
  if (m.isPopupOpen() && m.vData) m.setPopupContent(createPopup(m.vData));
}

async function checarForaDeRota() {
  if (checando) return;
  checando = true;
  try {
    const lista = busDataRaw.slice();

    // limpa status de veículos que sumiram
    const vivos = new Set(lista.map(v => v.prefixo));
    for (const p in statusRota) if (!vivos.has(p)) delete statusRota[p];

    // 1) baixa itinerários que faltam, poucos por vez
    const agora = Date.now();
    const faltam = Array.from(new Set(lista.map(linhaDe).filter(Boolean)))
      .filter(l => !itinerarioCache.has(l) && !(falhasItinerario.has(l) && agora - falhasItinerario.get(l) < RETRY_FALHA_MS));
    if (faltam.length) {
      textoProgresso = `Baixando ${faltam.length} itinerário(s)…`;
      renderSub();
      await prefetchItinerarios(faltam, DOWNLOADS_SIMULTANEOS);
    }

    // 2) confere os veículos em fatias curtas
    let t0 = performance.now();
    for (let i = 0; i < lista.length; i++) {
      verificarVeiculo(lista[i]);
      aplicarAlerta(lista[i].prefixo);
      if (performance.now() - t0 > FATIA_MS) {
        textoProgresso = `Verificando ${i + 1}/${lista.length}…`;
        renderSub();
        await yieldUI();
        t0 = performance.now();
      }
    }

    // 3) consolida
    const r = { total: 0, ok: 0, fora: 0, sentido: 0, semRota: 0, semItin: 0 };
    lista.forEach(v => {
      const st = statusRota[v.prefixo];
      if (!st) return;
      if (st.estado === 'semrota') r.semRota++;
      else if (st.estado === 'sem-itin' || st.estado === 'sem-gps') r.semItin++;
      else {
        r.total++;
        if (st.estado === 'sentido') r.sentido++;
        else if (st.estado === 'rota') r.fora++;
        else r.ok++;
      }
    });
    resumoAtual = r;
    ultimaVerificacao = Date.now();
    textoProgresso = '';
    atualizarPainel();

    if (soPerdidos()) render();
  } finally {
    checando = false;
  }
}

// --- PAINEL DE CONFLITOS ---
function renderSub() {
  const el = $('ap-sub');
  if (!el) return;
  if (textoProgresso) { el.textContent = textoProgresso; return; }
  if (!ultimaVerificacao) { el.textContent = 'Aguardando dados…'; return; }
  const s = Math.max(0, Math.floor((Date.now() - ultimaVerificacao) / 1000));
  el.textContent = `Atualizado há ${s}s · raio de ${RAIO_FORA_ROTA_M} m`;
}

function atualizarPainel() {
  const fab = $('alert-fab'), txt = $('alert-fab-text');
  const r = resumoAtual;
  if (!r) { txt.textContent = 'Verificando rotas…'; fab.classList.remove('tem-alerta'); return; }

  const perdidos = r.fora + r.sentido;
  fab.classList.toggle('tem-alerta', perdidos > 0);
  txt.textContent = perdidos > 0
    ? `${perdidos} veículo${perdidos > 1 ? 's' : ''} fora da rota`
    : 'Todos na rota';

  if (!$('alert-panel').classList.contains('open')) return;

  $('ap-stats').innerHTML = `
    <div class="chip ok"><b>${r.ok}</b><small>Na rota</small></div>
    <div class="chip fora"><b>${r.fora}</b><small>Fora da rota</small></div>
    <div class="chip sent"><b>${r.sentido}</b><small>Sentido errado</small></div>
  `;
  $('ap-foot').textContent = `${r.total} verificados · ${r.semRota} sem linha/transferência/VNR · ${r.semItin} sem itinerário`;

  const porPrefixo = new Map(busDataRaw.map(v => [v.prefixo, v]));
  const perdidosLista = Object.keys(statusRota)
    .filter(p => statusRota[p].fora && porPrefixo.has(p))
    .sort((a, b) => statusRota[b].dist - statusRota[a].dist);

  if (!perdidosLista.length) {
    $('ap-list').innerHTML = `<div class="ap-empty">✓ Nenhum conflito no momento</div>`;
  } else {
    const MAX = 150;
    $('ap-list').innerHTML = perdidosLista.slice(0, MAX).map(p => {
      const v = porPrefixo.get(p), st = statusRota[p];
      const sent = st.motivo === 'sentido';
      const detalhe = sent
        ? `Sentido possivelmente invertido · sistema: ${esc(v.sentido)}`
        : `Fora da rota · a ${Math.round(st.dist)} m · ${esc(v.sentido)}`;
      return `
        <div class="conf-item" data-prefixo="${esc(p)}">
          <div class="conf-badge ${sent ? 'sent' : ''}">!</div>
          <div class="conf-main"><b>Linha ${esc(v.linha)}</b> · ${esc(v.prefixo)}<small>${detalhe}</small></div>
          <div class="conf-go">›</div>
        </div>`;
    }).join('') + (perdidosLista.length > MAX ? `<div class="ap-foot" style="padding:10px 14px">+ ${perdidosLista.length - MAX} outros</div>` : '');
  }
  renderSub();
}

$('ap-list').addEventListener('click', (e) => {
  const item = e.target.closest('.conf-item');
  if (!item) return;
  selecionarVeiculo(item.dataset.prefixo, true);
  if (window.matchMedia('(max-width: 600px)').matches) alternarPainel(false);
});

// --- SELEÇÃO DE VEÍCULO ---
function selecionarVeiculo(prefixo, centralizar) {
  const v = busDataRaw.find(x => String(x.prefixo) === String(prefixo));
  if (!v) return;
  if (travaPopup && markers[travaPopup]) markers[travaPopup].closePopup();
  itemSelecionado = v;
  travaPopup = v.prefixo;
  drawRoute(v.linha, v.sentido);
  render();
  if (centralizar && Number.isFinite(v.latitude)) {
    map.flyTo([v.latitude, v.longitude], Math.max(map.getZoom(), 17), { duration: 0.6 });
  }
  const m = markers[v.prefixo];
  if (m) m.openPopup();
}

// --- BUSCA ---
const searchInput = $('search');

searchInput.addEventListener('input', (e) => {
  const val = e.target.value.toLowerCase();
  highlightedIndex = -1;
  $('btn-search-clear').classList.toggle('visible', val.length > 0);
  if (!val) { $('suggestions').style.display = 'none'; return; }

  const matches = Array.from(new Set(busDataRaw.flatMap(v => [v.linha, v.prefixo])))
    .filter(x => x && String(x).toLowerCase().includes(val))
    .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }))
    .slice(0, 610);

  $('suggestions').innerHTML = matches.map((m, i) => `<div class="suggestion-item" data-index="${i}" onclick="selectSuggestion('${m}')">${m}</div>`).join('');
  $('suggestions').style.display = matches.length ? 'block' : 'none';
});

searchInput.addEventListener('keydown', (e) => {
  const items = $('suggestions').getElementsByClassName('suggestion-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); highlightedIndex = (highlightedIndex + 1) % items.length; updateHighlight(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); highlightedIndex = (highlightedIndex - 1 + items.length) % items.length; updateHighlight(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (highlightedIndex > -1) items[highlightedIndex].click(); else if (items.length > 0) items[0].click(); }
  else if (e.key === 'Escape') { limparBuscaInput(); }
});

function updateHighlight(items) {
  Array.from(items).forEach((el, i) => {
    el.classList.toggle('highlighted', i === highlightedIndex);
    if (i === highlightedIndex) el.scrollIntoView({ block: 'nearest' });
  });
}

function selectSuggestion(val) {
  if (!termosBusca.includes(val)) {
    termosBusca.push(val);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.onclick = (event) => removerTag(event, val);
    tag.innerHTML = `${val} <span>✕</span>`;
    $('search-tags').appendChild(tag);
  }
  limparBuscaInput();
  render();
}

function removerTag(e, val) {
  termosBusca = termosBusca.filter(t => t !== val);
  Array.from($('search-tags').children).forEach(tag => {
    if (tag.textContent.includes(val)) tag.remove();
  });
  render();
}

function limparBuscaInput() {
  searchInput.value = '';
  $('suggestions').style.display = 'none';
  highlightedIndex = -1;
  $('btn-search-clear').classList.remove('visible');
}

// --- DADOS ---
async function fetchData() {
  try {
    const r = await fetch(API_URL);
    const json = await r.json();
    busDataRaw = json.veiculos;
    render();
    checarForaDeRota(); // roda em segundo plano, em fatias
  } catch (e) { console.error(e); }
}

function render() {
  const sectors = Array.from(document.querySelectorAll('.chk-sector:checked')).map(c => c.value);
  const showLine = $('chk-com-linha').checked;
  const showNoLine = $('chk-sem-linha').checked;
  const showTransfer = $('chk-transferencia').checked;
  const showVNR = $('chk-VNR').checked;
  const apenasPerdidos = soPerdidos();

  const currentIds = new Set();

  busDataRaw.forEach(v => {
    const sector = getSector(v.prefixo);
    const isTransfer = String(v.linha).trim() === "0.001";
    const isVNR = String(v.prefixo).trim() === "VNR";
    const hasLine = v.linha && v.linha.trim() !== "" && !isTransfer;

    let matchesBusca = true;
    if (termosBusca.length > 0) {
      matchesBusca = termosBusca.some(t => v.prefixo.includes(t) || (v.linha && v.linha.includes(t)));
    }

    if (itemSelecionado && v.prefixo !== itemSelecionado.prefixo && v.linha !== itemSelecionado.linha) return;
    if (!isVNR && !sectors.includes(sector)) return;
    if (!matchesBusca) return;
    if (isTransfer && !showTransfer) return;
    if (isVNR && !showVNR) return;
    if (hasLine && !showLine) return;
    if (!v.linha || v.linha.trim() === "") {
      if (!showNoLine && !isVNR) return;
    }
    if (apenasPerdidos && !(statusRota[v.prefixo] && statusRota[v.prefixo].fora)) return;

    currentIds.add(v.prefixo);
    const pos = [v.latitude, v.longitude];

    if (markers[v.prefixo]) {
      markers[v.prefixo].setLatLng(pos);
      markers[v.prefixo].vData = v;
      if (markers[v.prefixo].isPopupOpen()) {
        markers[v.prefixo].setPopupContent(createPopup(v));
      }
    } else {
      const icon = L.divIcon({
        className: '',
        html: `<div class="bus-marker-custom">${v.linha && v.linha.trim() !== "" ? v.linha : v.prefixo}</div>`,
        iconSize: [0, 0]
      });

      const m = L.marker(pos, { icon, zIndexOffset: 2000 }).addTo(map);
      m.vData = v;

      const popup = L.popup({ autoClose: false, closeOnClick: false }).setContent(createPopup(v));
      m.bindPopup(popup);

      m.on('mouseover', function () { this.openPopup(); });
      m.on('mouseout', function () {
        if (travaPopup !== v.prefixo) this.closePopup();
      });
      m.on('click', () => selecionarVeiculo(v.prefixo, false));
      m.on('popupclose', function () {
        if (travaPopup === v.prefixo) travaPopup = null;
      });

      markers[v.prefixo] = m;
      aplicarAlerta(v.prefixo); // já nasce com a borda vermelha se estiver perdido
    }
  });

  for (let id in markers) {
    if (!currentIds.has(id)) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }
  }
}

function createPopup(v) {
  let headerText = 'Sem Linha';
  if (String(v.linha).trim() === "0.001") {
    headerText = 'TRANSFERÊNCIA';
  } else if (String(v.prefixo).trim() === "VNR") {
    headerText = 'VNR';
  } else if (v.linha && v.linha.trim() !== "") {
    headerText = 'Linha ' + v.linha;
  }

  const st = statusRota[v.prefixo];
  let avisoRota = '';
  if (st && st.fora) {
    if (st.motivo === 'sem-linha') {
      avisoRota = `<div class="p-alerta">⚠ Veículo sem linha atribuída</div>`;
    } else if (st.motivo === 'sentido') {
      avisoRota = `<div class="p-alerta">⚠ Sentido possivelmente invertido no sistema</div>`;
    } else {
      avisoRota = `<div class="p-alerta">⚠ Fora da rota (a ${Math.round(st.dist)} m)</div>`;
    }
  }

  return `
    <div class="p-header">${headerText}</div>
    <div class="p-body">
      ${avisoRota}
      <div class="p-row"><span class="p-label">Prefixo</span><span class="p-val">${v.prefixo}</span></div>
      <div class="p-row"><span class="p-label">Sentido</span><span class="p-val">${v.sentido}</span></div>
      <div class="p-row"><span class="p-label">Data</span><span class="p-val">${v.data}</span></div>
      <div class="p-row"><span class="p-label">Hora</span><span class="p-val">${v.hora}</span></div>
      <div class="p-row"><span class="p-label">Status</span><span class="p-val" id="stat-${v.prefixo}">${getLiveStatus(v.data, v.hora)}</span></div>
      <div class="divider" style="margin:8px 0"></div>
      <div class="p-row"><span class="p-label">Data Prev.</span><span class="p-val">${v.dataProgramada || '--'}</span></div>
      <div class="p-row"><span class="p-label">Horário Prev.</span><span class="p-val">${v.horaProgramada || '--'}</span></div>
    </div>
  `;
}

function renderStops(itinerario) {
  activeStops.forEach(s => map.removeLayer(s));
  activeStops = [];

  if (itinerario && itinerario.stops) {
    const batchStops = [];
    itinerario.stops.forEach((stop, idx) => {
      const sMarker = L.marker([stop.lat, stop.lng], {
        icon: createStopIcon(idx + 1),
        zIndexOffset: 500
      });

      sMarker.bindPopup(`<b>Parada ${idx + 1} |</b> ${stop.name}`, {
        className: 'popup-parada',
        minWidth: 180,
        maxWidth: 450,
        closeButton: true,
        autoPan: false
      });

      sMarker.on('mouseover', function (e) {
        const marker = e.target;
        marker.openPopup();
        const popupElement = marker.getPopup().getElement();
        if (popupElement) {
          popupElement.addEventListener('mouseleave', () => marker.closePopup());
        }
      });

      sMarker.on('mouseout', function (e) {
        const marker = e.target;
        setTimeout(() => {
          const container = marker.getPopup().getElement();
          if (container && !container.matches(':hover')) marker.closePopup();
        }, 50);
      });

      sMarker.addTo(map);
      batchStops.push(sMarker);
    });
    activeStops = batchStops;
  }
}

async function drawRoute(linha, sentido) {
  if (!linha) return;
  if (rotaAtiva && rotaAtiva.linha === linha && rotaAtiva.sentido === sentido) return;

  activePolylines.forEach(p => map.removeLayer(p));
  activeStops.forEach(s => map.removeLayer(s));
  activePolylines = [];
  activeStops = [];

  const targetDirection = (sentido === "Ida") ? 0 : 1;

  function plot(itinerario) {
    rotaAtiva = { linha, sentido, itinerarioCompleto: itinerario };

    if (itinerario.shape) {
      const coords = decodePolyline(itinerario.shape);
      activePolylines.push(L.polyline(coords, { color: 'black', weight: 8 }).addTo(map));
      activePolylines.push(L.polyline(coords, { color: BSBUS_GREEN, weight: 4 }).addTo(map));
    }

    if ($('chk-show-stops').checked) renderStops(itinerario);
  }

  if (itinerarioCache.has(linha)) {
    const cachedData = itinerarioCache.get(linha);
    const itinerario = cachedData.itinerarios.find(i => i.directionId === targetDirection) || cachedData.itinerarios[0];
    if (itinerario) plot(itinerario);
    return;
  }

  try {
    const response = await fetch(`https://gps-bsbus.vercel.app/itinerario/${linha}`);
    const data = await response.json();

    if (data && data.itinerarios) {
      itinerarioCache.set(linha, data);
      const itinerario = data.itinerarios.find(i => i.directionId === targetDirection) || data.itinerarios[0];
      if (itinerario) plot(itinerario);
    }
  } catch (err) {
    console.error("Erro ao buscar itinerário:", err);
  }
}

map.on('click', () => {
  itemSelecionado = null;
  rotaAtiva = null;
  activePolylines.forEach(p => map.removeLayer(p));
  activeStops.forEach(s => map.removeLayer(s));
  activePolylines = [];
  activeStops = [];
  map.closePopup();
  fecharMenu();
  render();
});

// relógio ao vivo (popup + painel)
setInterval(() => {
  for (let id in markers) {
    const el = document.getElementById(`stat-${id}`);
    if (el) el.innerText = getLiveStatus(markers[id].vData.data, markers[id].vData.hora);
  }
  renderSub();
}, 1000);

document.querySelectorAll('input[type=checkbox]').forEach(c => c.addEventListener('change', render));

fetchData();
setInterval(fetchData, 10000);
</script>
